<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reto exprés · ¿Cómo viaja el dato?</title>
<style>
  :root{--blue:#0073B0;--lb:#32A5D1;--db:#005A8C;--pale:#EAF4FA;--amb:#F08A24;--red:#C0392B;--ok:#1E8E5A;--ink:#1F2A37;--mut:#6B7A8A;--line:#D9E6EF}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Montserrat,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--pale);-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
  header{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--blue);font-weight:700;margin-bottom:14px}
  header span:last-child{font-weight:400}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}
  h1{font-size:28px;line-height:1.15;color:var(--blue);margin:0 0 8px}
  h2{font-size:20px;color:var(--blue);margin:0 0 10px}
  p{line-height:1.5;margin:0 0 12px}
  .lab{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
  .rules{margin:14px 0 18px;padding:0;list-style:none}
  .rules li{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;line-height:1.45}
  .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
  button{font:inherit;cursor:pointer;border-radius:999px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;padding:13px 18px}
  button:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
  .go{background:var(--blue);color:#fff;width:100%;font-size:17px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--mut)}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
  .bar i{display:block;height:100%;width:100%;background:var(--amb)}
  .q{font-size:19px;font-weight:700;line-height:1.4;min-height:5.6em;margin-bottom:14px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opts button:last-child{grid-column:1 / -1}
  .opts button{font-size:16px;padding:15px 10px}
  .opts button[disabled]{cursor:default;opacity:.55}
  .opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
  .opts button.ko{background:var(--red);border-color:var(--red);color:#fff;opacity:1}
  .fb{margin-top:14px;padding:14px 16px;border-radius:8px;background:var(--pale);display:none}
  .fb b{color:var(--blue)}
  .fb .price{color:var(--red);font-weight:700}
  .next{margin-top:12px;width:100%;background:var(--blue);color:#fff;display:none}
  .score{font-size:54px;font-weight:700;color:var(--amb);line-height:1}
  .copy{background:var(--ink);color:#fff;border-radius:8px;padding:12px 14px;font-weight:700;margin:12px 0;user-select:all;word-break:break-word}
  .rev{border-top:1px solid var(--line);padding:12px 0}
  .rev .s{font-weight:700;margin-bottom:4px}
  .tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;color:#fff;margin-right:6px}
  .tag.ok{background:var(--ok)} .tag.ko{background:var(--red)}
  footer{margin-top:16px;font-size:11px;color:var(--mut);text-align:center}
  @media (max-width:520px){h1{font-size:23px}.q{font-size:17px}.opts{grid-template-columns:1fr}.opts button:last-child{grid-column:auto}}
</style>
<style>.vbar{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#005A8C;color:#fff;font:600 13px/1.2 Montserrat,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:max(7px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 7px max(14px,env(safe-area-inset-left));box-shadow:0 1px 0 rgba(255,255,255,.18),0 2px 8px rgba(0,0,0,.12)}.vbar a{color:#fff;text-decoration:none;border-radius:999px;padding:8px 15px;min-height:38px;display:inline-flex;align-items:center;white-space:nowrap}.vbar .vb-back{background:#F08A24;font-weight:700;letter-spacing:.01em}.vbar .vb-home{border:1px solid rgba(255,255,255,.55)}.vbar a:hover{filter:brightness(1.1)}.vbar a:focus-visible{outline:3px solid #fff;outline-offset:2px}@media print{.vbar{display:none}}</style></head>
<body>
<nav class="vbar" aria-label="Volver al sitio de la asignatura"><a class="vb-back" href="../../#expres">‹ Volver a Retos exprés</a><a class="vb-home" href="../../#home">Inicio</a></nav>
<div class="wrap">
  <header><span>Integración BPM · Retos exprés</span><span>Tema 3 · Arquitectura de integración</span></header>
  <main id="app" class="card" aria-live="polite"></main>
  <footer>Integración en los Procesos de Negocio (BPM) · Reto de clase · Caso docente de Nimbus Solutions</footer>
</div>
<script>
(function(){
  var M=['Archivo','Datos compartidos','Llamada','Mensajería','Eventos'];
  var Q=[
   {t:'Cada noche, el gestor de tickets tiene que pasar al ERP las horas trabajadas fuera de contrato para facturarlas. Son cientos de líneas y nadie las necesita antes de las 8:00.',a:0,
    w:'Mucho volumen y ninguna prisa: «mañana vale». Un fichero por lotes es lo más sencillo.',p:'El dato llega con retraso y los errores se descubren al día siguiente.'},
   {t:'El cliente está en el portal, a punto de enviar su incidencia. El portal tiene que decirle en pantalla qué plazo de atención le corresponde según su contrato.',a:2,
    w:'Quien pide necesita la respuesta para poder continuar: el portal pregunta al CRM y espera.',p:'Si el CRM cae o va lento, el portal también.'},
   {t:'De madrugada, el gestor de tickets está en mantenimiento. Las incidencias de los clientes con contrato 24/7 no pueden perderse.',a:3,
    w:'El destino puede no estar y nada puede perderse: la incidencia espera en una cola hasta que el gestor vuelve.',p:'Hace falta un intermediario, la respuesta no es inmediata y un mensaje puede llegar dos veces.'},
   {t:'Cuando una incidencia queda registrada, deben enterarse el cliente, el agente de triaje y el técnico de guardia. El mes que viene, también un panel de tiempos.',a:4,
    w:'Un mismo hecho interesa a varios, hoy y mañana: se publica «Incidencia registrada» y lo recibe quien esté suscrito.',p:'Nadie ve el recorrido completo: cuesta más saber qué falló y dónde.'},
   {t:'Para ir más rápido, alguien propone que el portal lea el contrato del cliente directamente en las tablas del CRM. ¿Qué mecanismo es ese?',a:1,
    w:'Dos sistemas leyendo las mismas tablas: es la «libreta compartida». Se reconoce para evitarlo.',p:'El contrato deja de tener un único dueño, y un cambio en una tabla del CRM rompe el portal sin avisar.'},
   {t:'Cae un servicio de correo que usan 60 clientes: entran 300 incidencias en diez minutos. El gestor de tickets solo registra unas pocas a la vez, y no puede perderse ninguna.',a:3,
    w:'Llega todo de golpe: la cola absorbe el pico y el gestor trabaja a su ritmo.',p:'Las últimas incidencias tardan más en quedar registradas.'},
   {t:'La monitorización detecta que el servidor de un cliente no responde. Tienen que reaccionar soporte, el responsable de la cuenta y el panel de estado; y mañana, quizá alguien más.',a:4,
    w:'Es un hecho que ya ha ocurrido y que interesa a varios: quien lo publica no necesita saber quién lo escucha.',p:'Si alguien no reacciona, cuesta darse cuenta: nadie ve el recorrido completo.'},
   {t:'El técnico tiene al cliente al teléfono y pulsa «ver contrato» en el gestor de tickets: necesita el dato ahora para decirle qué cubre su servicio.',a:2,
    w:'Sin la respuesta no puede seguir la conversación: el gestor pregunta al CRM y espera.',p:'Depende de que el CRM esté disponible en ese momento.'}
  ];
  var T=20, app=document.getElementById('app'), i=0, pts=0, hits=0, log=[], timer=null, left=T, locked=false;
  function el(tag,cls,txt){var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e;}
  function clear(){while(app.firstChild) app.removeChild(app.firstChild);}
  function intro(){
    clear();
    app.appendChild(el('div','lab','Reto exprés'));
    app.appendChild(el('h1',null,'¿Cómo viaja el dato?'));
    app.appendChild(el('p',null,'Ocho situaciones de Nimbus Solutions. En cada una, decide con qué mecanismo debe viajar el dato.'));
    var ul=el('ul','rules');
    [['Veinte segundos por situación.','Si se acaba el tiempo, cuenta como fallo.'],['Cinco respuestas posibles.','Archivo, datos compartidos, llamada, mensajería o eventos.'],['Acertar deprisa puntúa más.','100 puntos por acierto y hasta 50 por rapidez.']].forEach(function(r,k){
      var li=el('li'); li.appendChild(el('span','n',String(k+1))); var d=el('div'); var b=el('b',null,r[0]+' '); d.appendChild(b); d.appendChild(document.createTextNode(r[1])); li.appendChild(d); ul.appendChild(li);});
    app.appendChild(ul);
    var b=el('button','go','Empezar'); b.onclick=function(){i=0;pts=0;hits=0;log=[];ask();}; app.appendChild(b); b.focus();
  }
  function ask(){
    clear(); locked=false; left=T; var q=Q[i];
    var top=el('div','top'); top.appendChild(el('span',null,'Situación '+(i+1)+' de '+Q.length)); var clock=el('span',null,T+' s'); top.appendChild(clock); app.appendChild(top);
    var bar=el('div','bar'), fill=el('i'); bar.appendChild(fill); app.appendChild(bar);
    app.appendChild(el('div','q',q.t));
    var opts=el('div','opts'); app.appendChild(opts);
    var fb=el('div','fb'); app.appendChild(fb);
    var nx=el('button','next', i<Q.length-1?'Siguiente situación':'Ver mi puntuación'); app.appendChild(nx);
    nx.onclick=function(){i++; if(i<Q.length) ask(); else end();};
    function done(k){
      if(locked) return; locked=true; clearInterval(timer);
      var ok=(k===q.a), gain=ok?100+Math.round(50*left/T):0; pts+=gain; if(ok) hits++;
      log.push({q:q,k:k,ok:ok});
      Array.prototype.forEach.call(opts.children,function(b,j){b.disabled=true; if(j===q.a) b.className='ok'; else if(j===k) b.className='ko';});
      var head=el('p'); var hb=el('b',null, ok?'Correcto: '+M[q.a]+'. +'+gain+' puntos.':(k<0?'Se acabó el tiempo. ':'No. ')+'Era '+M[q.a]+'.'); head.appendChild(hb); fb.appendChild(head);
      fb.appendChild(el('p',null,q.w));
      var pr=el('p'); pr.appendChild(el('span','price','Su precio: ')); pr.appendChild(document.createTextNode(q.p)); pr.style.marginBottom='0'; fb.appendChild(pr);
      fb.style.display='block'; nx.style.display='block'; nx.focus();
    }
    M.forEach(function(m,k){var b=el('button',null,m); b.onclick=function(){done(k);}; opts.appendChild(b);});
    var t0=Date.now();
    timer=setInterval(function(){
      left=Math.max(0,T-(Date.now()-t0)/1000); fill.style.width=(100*left/T)+'%'; clock.textContent=Math.ceil(left)+' s';
      if(left<=5) fill.style.background='#C0392B';
      if(left<=0) done(-1);
    },100);
  }
  function end(){
    clear();
    app.appendChild(el('div','lab','Tu resultado'));
    app.appendChild(el('div','score',hits+' / '+Q.length));
    var msg=hits===Q.length?'Pleno. Lees el requisito antes que el nombre.':hits>=6?'Muy bien. Repasa abajo las que se te han escapado.':hits>=4?'Vas bien encaminado. Fíjate en el porqué de cada fallo.':'Repasa abajo cada situación: lo que decide es siempre el requisito.';
    app.appendChild(el('p',null,pts+' puntos. '+msg));
    app.appendChild(el('div','lab','Pega esto en el chat'));
    var txt='Reto exprés: '+hits+'/'+Q.length+' · '+pts+' puntos';
    app.appendChild(el('div','copy',txt));
    var cb=el('button',null,'Copiar puntuación'); app.appendChild(cb);
    cb.onclick=function(){try{navigator.clipboard.writeText(txt).then(function(){cb.textContent='Copiada';},function(){cb.textContent='Selecciónala y cópiala a mano';});}catch(e){cb.textContent='Selecciónala y cópiala a mano';}};
    var again=el('button',null,'Jugar otra vez'); again.style.marginLeft='8px'; again.onclick=intro; app.appendChild(again);
    var h=el('h2',null,'Repaso: lo que decide es el requisito'); h.style.marginTop='22px'; app.appendChild(h);
    log.forEach(function(r,k){
      var d=el('div','rev'); d.appendChild(el('div','s',(k+1)+'. '+r.q.t));
      var l=el('div'); l.appendChild(el('span','tag '+(r.ok?'ok':'ko'), r.ok?'Acierto':'Fallo'));
      l.appendChild(document.createTextNode((r.ok?'':'Respondiste: '+(r.k<0?'sin respuesta':M[r.k])+'. ')+'Era '+M[r.q.a]+'. '+r.q.w+' '));
      var pr=el('span','price','Su precio: '); l.appendChild(pr); l.appendChild(document.createTextNode(r.q.p)); d.appendChild(l); app.appendChild(d);
    });
  }
  intro();
})();
</script>
</body>
</html>
